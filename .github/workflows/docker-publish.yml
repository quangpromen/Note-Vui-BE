name: Docker Publish to GHCR

on:
  push:
    branches: [ "main" ] # Chỉ Build Docker và Public khi Code đã chạy vào nhánh chính

env:
  # Cấu hình chứa tên kho Docker (Vd: ghcr.io/quangpromen/notevui-be)
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    
    # Cấp quyền cho GitHub Actions có thể Public package lên repo của bạn
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Đăng nhập vào GitHub Container Registry bằng Token có sẵn của GitHub
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Trích xuất metadata (VD: tag version giống commit id)
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Gọi Docker build ra image và đẩy lên GitHub Packages (GHCR)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
